apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventify-api
  namespace: eventify-system
  labels:
    app: eventify-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eventify-api
  template:
    metadata:
      labels:
        app: eventify-api
    spec:
      containers:
        - name: api
          image: eventify/api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "development"
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              value: "postgresql://eventify_admin:secret@postgres-service:5432/eventify?schema=public"
            - name: DATABASE_APP_URL
              value: "postgresql://eventify_admin:secret@postgres-service:5432/eventify?schema=public"
            - name: REDIS_HOST
              value: "redis-service"
            - name: REDIS_PORT
              value: "6379"
            - name: JWT_SECRET
              value: "development-jwt-secret-key-must-be-at-least-32-chars-long"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: eventify-api-service
  namespace: eventify-system
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: eventify-api
