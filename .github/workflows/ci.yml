name: Eventify CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Lint, Test & Build Apps
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eventify_admin
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: eventify
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm Package Manager
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false

      - name: Get pnpm Store Directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm Dependency Cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Push Database Schema to Test PostgreSQL Container
        run: pnpm --filter api exec prisma db push
        env:
          DATABASE_URL: "postgresql://eventify_admin:secret@localhost:5432/eventify?schema=public"
          DATABASE_APP_URL: "postgresql://eventify_admin:secret@localhost:5432/eventify?schema=public"

      - name: Run Monorepo Build Verification
        run: pnpm build
        env:
          DATABASE_URL: "postgresql://eventify_admin:secret@localhost:5432/eventify?schema=public"
          DATABASE_APP_URL: "postgresql://eventify_admin:secret@localhost:5432/eventify?schema=public"
          JWT_SECRET: "ci-testing-jwt-secret-key-must-be-long-enough-32-chars"
          REDIS_HOST: "localhost"
          REDIS_PORT: 6379

      - name: Execute API E2E Integration Test Suite
        run: pnpm --filter api test:e2e
        env:
          DATABASE_URL: "postgresql://eventify_admin:secret@localhost:5432/eventify?schema=public"
          DATABASE_APP_URL: "postgresql://eventify_admin:secret@localhost:5432/eventify?schema=public"
          JWT_SECRET: "ci-testing-jwt-secret-key-must-be-long-enough-32-chars"
          REDIS_HOST: "localhost"
          REDIS_PORT: 6379
